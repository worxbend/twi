name: twi

x-twi: &twi
  build:
    context: .
  image: twi:local
  environment:
    TERM: ${TERM:-xterm-256color}
    TWI_AVATAR_MODE: ${TWI_AVATAR_MODE:-initials}
    TWI_ANIMATION_MODE: ${TWI_ANIMATION_MODE:-fast}

services:
  mock:
    <<: *twi
    command: ["chat", "--mock", "--channel", "${TWITCH_CHANNEL:-demo}"]
    stdin_open: true
    tty: true

  live:
    <<: *twi
    command: ["chat", "--channel", "${TWITCH_CHANNEL:-demo}"]
    env_file:
      - path: .env
        required: false
    environment:
      TERM: ${TERM:-xterm-256color}
      TWI_AVATAR_MODE: ${TWI_AVATAR_MODE:-initials}
      TWI_ANIMATION_MODE: ${TWI_ANIMATION_MODE:-fast}
    stdin_open: true
    tty: true

  doctor:
    <<: *twi
    command: ["doctor"]

  recorder:
    <<: *twi
    command: ["record", "--channel", "${TWITCH_CHANNEL:-demo}"]
    env_file:
      - path: .env
        required: false
    volumes:
      - twi-state:/state
      - twi-config:/config
      - twi-cache:/cache
    init: true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    stop_grace_period: 15s

volumes:
  twi-state:
  twi-config:
  twi-cache:
