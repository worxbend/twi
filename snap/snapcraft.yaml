name: twi
base: core24
grade: stable
confinement: classic
adopt-info: twi
summary: Terminal Twitch chat and automation client
description: |
  twi is a terminal Twitch chat and automation client built with Bubble Tea v2. It supports
  live multi-channel chat, 57 built-in themes plus custom hex palettes, emote
  autocomplete, Twitch OAuth login, acknowledged chat production, live reading,
  and explicitly enabled local SQLite recording and history search.

  Run `twi chat --mock` for a credential-free demo, or `twi setup` for a
  guided path to live chat.

  This snap uses classic confinement (unsandboxed, like a traditional
  package) so it can read/write config, cache, and credential files at their
  normal locations under the real $HOME (e.g. ~/.config/twi,
  ~/.cache/twi) instead of a snap-specific sandboxed data directory, and so
  `twi login` can bind its local OAuth callback listener and launch a
  browser without interface-plug restrictions. Install with
  `snap install twi --classic`.

license: MIT

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [amd64, arm64]
    build-for: [arm64]

apps:
  twi:
    command: bin/twi

parts:
  twi:
    plugin: go
    source: .
    # core24's golang-go apt package predates go.mod's `toolchain go1.27.2`;
    # with GOTOOLCHAIN=auto that mismatch makes `go version` print a
    # "downloading go1.27.2" message instead of a parseable version string,
    # which fails snapcraft's go-plugin environment check. Source Go from the
    # snap instead. As of 2026-10-11, 1.27/stable still carries Go 1.27.1;
    # candidate carries the official stable Go 1.27.2 release. Return to the
    # stable track once it includes the pinned toolchain.
    build-snaps:
      - go/1.27/candidate
    build-environment:
      - CGO_ENABLED: "0"
      - GOTOOLCHAIN: auto
    override-build: |
      craftctl default
      expected=$(awk '$1 == "toolchain" {print $2}' go.mod)
      actual=$(go version | awk '{print $3}')
      test "$actual" = "$expected"
      CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X github.com/worxbend/twi/internal/cli.buildVersion=$(craftctl get version)" -o "$CRAFT_PART_INSTALL/bin/twi" ./cmd/twi
    override-pull: |
      craftctl default
      craftctl set version="${TWI_BUILD_VERSION:-$(git -C "$CRAFT_PART_SRC" describe --tags --always --dirty 2>/dev/null || echo 0.0.0-unknown)}"
