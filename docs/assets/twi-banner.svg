<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" aria-labelledby="bannerTitle bannerDesc" role="img" viewBox="0 0 1200 400"><title id="bannerTitle">twi — a terminal Twitch chat client</title><desc id="bannerDesc">Banner showing the twi wordmark, tagline, and a mock terminal window with grouped Twitch chat messages.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0a0a12"/><stop offset=".55" stop-color="#141026"/><stop offset="1" stop-color="#1c1033"/></linearGradient><linearGradient id="wordmark" x1="0" x2="1" y1="0" y2=".4"><stop offset="0" stop-color="#c8a2ff"/><stop offset=".5" stop-color="#9146ff"/><stop offset="1" stop-color="#f97362"/></linearGradient><linearGradient id="rule" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#9146ff" stop-opacity=".9"/><stop offset="1" stop-color="#9146ff" stop-opacity="0"/></linearGradient><linearGradient id="glass" x1="0" x2=".4" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity=".02"/></linearGradient><radialGradient id="glowA" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9146ff" stop-opacity=".5"/><stop offset="1" stop-color="#9146ff" stop-opacity="0"/></radialGradient><radialGradient id="glowB" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f97362" stop-opacity=".34"/><stop offset="1" stop-color="#f97362" stop-opacity="0"/></radialGradient><pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path fill="none" stroke="#fff" stroke-opacity=".032" stroke-width="1" d="M26 0H0V26"/></pattern><filter id="soft" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="16" flood-color="#000" flood-opacity=".55" stdDeviation="22"/></filter></defs><rect width="1200" height="400" fill="url(#bg)"/><rect width="1200" height="400" fill="url(#grid)"/><ellipse cx="215" cy="120" fill="url(#glowA)" rx="300" ry="220"/><ellipse cx="1010" cy="330" fill="url(#glowB)" rx="290" ry="210"/><g transform="translate(74 96)"><text x="0" y="86" fill="url(#wordmark)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="112" font-weight="700" letter-spacing="-3">twi</text><rect width="250" height="3" x="4" y="106" fill="url(#rule)" rx="1.5"/><text x="4" y="146" fill="#efeaf7" font-family="ui-sans-serif, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="600">Twitch chat that lives in your terminal.</text><text x="4" y="178" fill="#a79cc4" font-family="ui-sans-serif, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16.5">Keyboard-first · 13 themes · no browser tab</text><g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600"><g transform="translate(4 204)"><rect width="80" height="28" fill="#9146ff" fill-opacity=".16" stroke="#9146ff" stroke-opacity=".5" rx="14"/><text x="40" y="18.5" fill="#c8a2ff" text-anchor="middle">Go 1.26</text></g><g transform="translate(92 204)"><rect width="96" height="28" fill="#f97362" fill-opacity=".14" stroke="#f97362" stroke-opacity=".45" rx="14"/><text x="48" y="18.5" fill="#ffab9c" text-anchor="middle">Bubble Tea</text></g><g transform="translate(196 204)"><rect width="62" height="28" fill="#4ade80" fill-opacity=".13" stroke="#4ade80" stroke-opacity=".42" rx="14"/><text x="31" y="18.5" fill="#86efac" text-anchor="middle">MIT</text></g></g></g><g filter="url(#soft)" transform="translate(556 58)"><rect width="586" height="284" fill="#100d1c" stroke="#2e2447" stroke-width="1.5" rx="16"/><rect width="586" height="34" fill="url(#glass)" rx="16"/><rect width="586" height="16" y="18" fill="#fff" fill-opacity=".03"/><circle cx="22" cy="17" r="5.5" fill="#ff5f57"/><circle cx="41" cy="17" r="5.5" fill="#febc2e"/><circle cx="60" cy="17" r="5.5" fill="#28c840"/><text x="293" y="21.5" fill="#9c8fbd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" text-anchor="middle">twi chat --channel pixelforge</text><g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5"><rect width="558" height="22" x="14" y="46" fill="#9146ff" fill-opacity=".15" rx="6"/><text x="26" y="61" fill="#d9ccff">● LIVE 1:37</text><text x="142" y="61" fill="#8f83ad">#pixelforge · connected</text><text x="470" y="61" fill="#c8a2ff">1284 here</text><rect width="558" height="46" x="14" y="80" fill="#f97362" fill-opacity=".07" rx="8"/><rect width="2.5" height="46" x="14" y="80" fill="#f97362" rx="1.25"/><text x="30" y="97" fill="#f97362" font-weight="700">◉ PixelForge</text><text x="150" y="97" fill="#6f6489" font-size="11.5">20:14 · broadcaster · follows 2y</text><text x="30" y="117" fill="#ddd6ea">building the render pipeline today</text><rect width="558" height="66" x="14" y="134" fill="#22d3ee" fill-opacity=".06" rx="8"/><rect width="2.5" height="66" x="14" y="134" fill="#22d3ee" rx="1.25"/><text x="30" y="151" fill="#22d3ee" font-weight="700">⚔ nova_dev</text><text x="142" y="151" fill="#6f6489" font-size="11.5">20:15 · mod · sub 26mo</text><text x="30" y="171" fill="#ddd6ea">finally a client that lives in my terminal</text><rect width="48" height="18" x="376" y="158" fill="#4ade80" fill-opacity=".18" rx="4"/><text x="382" y="171" fill="#4ade80">Kappa</text><text x="30" y="191" fill="#ddd6ea">grouped layout reads so much better</text><rect width="558" height="46" x="14" y="208" fill="#c084fc" fill-opacity=".07" rx="8"/><rect width="2.5" height="46" x="14" y="208" fill="#c084fc" rx="1.25"/><text x="30" y="225" fill="#c084fc" font-weight="700">◆ SyntaxError</text><text x="170" y="225" fill="#6f6489" font-size="11.5">20:17 · vip · follows 2mo</text><text x="30" y="245" fill="#8ab4ff">@nova_dev</text><text x="116" y="245" fill="#ddd6ea">agreed, the swatches sold me</text><rect width="558" height=".8" x="14" y="264" fill="#2e2447"/><text x="30" y="278" fill="#6f6489">▌ Message #pixelforge…</text></g></g></svg>