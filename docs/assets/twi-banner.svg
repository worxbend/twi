<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">twi — a terminal Twitch chat client</title>
  <desc id="bannerDesc">Banner showing the twi wordmark, tagline, and a mock terminal window with grouped Twitch chat messages.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a12"/>
      <stop offset="0.55" stop-color="#141026"/>
      <stop offset="1" stop-color="#1c1033"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#c8a2ff"/>
      <stop offset="0.5" stop-color="#9146ff"/>
      <stop offset="1" stop-color="#f97362"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9146ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9146ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9146ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#9146ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f97362" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#f97362" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#ffffff" stroke-opacity="0.032" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <ellipse cx="215" cy="120" rx="300" ry="220" fill="url(#glowA)"/>
  <ellipse cx="1010" cy="330" rx="290" ry="210" fill="url(#glowB)"/>

  <!-- Left column: wordmark, tagline, capability chips -->
  <g transform="translate(74 96)">
    <text x="0" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="112" font-weight="700" letter-spacing="-3" fill="url(#wordmark)">twi</text>
    <rect x="4" y="106" width="250" height="3" rx="1.5" fill="url(#rule)"/>

    <text x="4" y="146" font-family="ui-sans-serif, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#efeaf7">Twitch chat that lives in your terminal.</text>
    <text x="4" y="178" font-family="ui-sans-serif, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16.5" fill="#a79cc4">Keyboard-first · 13 themes · no browser tab</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600">
      <g transform="translate(4 204)">
        <rect width="80" height="28" rx="14" fill="#9146ff" fill-opacity="0.16" stroke="#9146ff" stroke-opacity="0.5"/>
        <text x="40" y="18.5" fill="#c8a2ff" text-anchor="middle">Go 1.26</text>
      </g>
      <g transform="translate(92 204)">
        <rect width="96" height="28" rx="14" fill="#f97362" fill-opacity="0.14" stroke="#f97362" stroke-opacity="0.45"/>
        <text x="48" y="18.5" fill="#ffab9c" text-anchor="middle">Bubble Tea</text>
      </g>
      <g transform="translate(196 204)">
        <rect width="62" height="28" rx="14" fill="#4ade80" fill-opacity="0.13" stroke="#4ade80" stroke-opacity="0.42"/>
        <text x="31" y="18.5" fill="#86efac" text-anchor="middle">MIT</text>
      </g>
    </g>
  </g>

  <!-- Right column: mock terminal window -->
  <g transform="translate(556 58)" filter="url(#soft)">
    <rect width="586" height="284" rx="16" fill="#100d1c" stroke="#2e2447" stroke-width="1.5"/>
    <rect width="586" height="34" rx="16" fill="url(#glass)"/>
    <rect y="18" width="586" height="16" fill="#ffffff" fill-opacity="0.03"/>
    <circle cx="22" cy="17" r="5.5" fill="#ff5f57"/>
    <circle cx="41" cy="17" r="5.5" fill="#febc2e"/>
    <circle cx="60" cy="17" r="5.5" fill="#28c840"/>
    <text x="293" y="21.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9c8fbd" text-anchor="middle">twi chat --channel pixelforge</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5">
      <rect x="14" y="46" width="558" height="22" rx="6" fill="#9146ff" fill-opacity="0.15"/>
      <text x="26" y="61" fill="#d9ccff">● LIVE 1:37</text>
      <text x="142" y="61" fill="#8f83ad">#pixelforge · connected</text>
      <text x="470" y="61" fill="#c8a2ff">1284 here</text>

      <rect x="14" y="80" width="558" height="46" rx="8" fill="#f97362" fill-opacity="0.07"/>
      <rect x="14" y="80" width="2.5" height="46" rx="1.25" fill="#f97362"/>
      <text x="30" y="97" fill="#f97362" font-weight="700">◉ PixelForge</text>
      <text x="150" y="97" fill="#6f6489" font-size="11.5">20:14 · broadcaster · follows 2y</text>
      <text x="30" y="117" fill="#ddd6ea">building the render pipeline today</text>

      <rect x="14" y="134" width="558" height="66" rx="8" fill="#22d3ee" fill-opacity="0.06"/>
      <rect x="14" y="134" width="2.5" height="66" rx="1.25" fill="#22d3ee"/>
      <text x="30" y="151" fill="#22d3ee" font-weight="700">⚔ nova_dev</text>
      <text x="142" y="151" fill="#6f6489" font-size="11.5">20:15 · mod · sub 26mo</text>
      <text x="30" y="171" fill="#ddd6ea">finally a client that lives in my terminal</text>
      <rect x="376" y="158" width="48" height="18" rx="4" fill="#4ade80" fill-opacity="0.18"/>
      <text x="382" y="171" fill="#4ade80">Kappa</text>
      <text x="30" y="191" fill="#ddd6ea">grouped layout reads so much better</text>

      <rect x="14" y="208" width="558" height="46" rx="8" fill="#c084fc" fill-opacity="0.07"/>
      <rect x="14" y="208" width="2.5" height="46" rx="1.25" fill="#c084fc"/>
      <text x="30" y="225" fill="#c084fc" font-weight="700">◆ SyntaxError</text>
      <text x="170" y="225" fill="#6f6489" font-size="11.5">20:17 · vip · follows 2mo</text>
      <text x="30" y="245" fill="#8ab4ff">@nova_dev</text>
      <text x="116" y="245" fill="#ddd6ea">agreed, the swatches sold me</text>

      <rect x="14" y="264" width="558" height="0.8" fill="#2e2447"/>
      <text x="30" y="278" fill="#6f6489">▌ Message #pixelforge…</text>
    </g>
  </g>
</svg>
