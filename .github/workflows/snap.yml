name: Snap

# Manual only, for now.
#
# The build and smoke steps pass; publishing fails because the snap name
# "twi" has never been registered in the Snap Store, so every push to main
# and every release tag reported a red Snap run for a reason unrelated to the
# commit that triggered it. A permanently failing required-looking check is
# worse than no check: it trains everyone to ignore the one signal that would
# matter when something real breaks.
#
# To re-enable: register the name at https://snapcraft.io/register-snap
# (or `snapcraft register twi`), confirm a manual run publishes, then restore
# the push trigger below.
#
# on:
#   workflow_dispatch:
#   push:
#     branches:
#       - main
#     tags:
#       - "v*"
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and publish snap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # `if:` conditions cannot reference the secrets context directly; this
      # computes a plain boolean env var once so the publish steps below can
      # check it instead.
      HAVE_SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # snapcraft.yaml derives the snap version from `git describe --tags`,
          # which needs real tag history, not a shallow clone.
          fetch-depth: 0

      - name: Set up Go for package metadata validation
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build snap
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: build
        with:
          snapcraft-args: --platform amd64

      - name: Smoke the built snap
        env:
          TWI_TWITCH_USERNAME: ""
          TWI_TWITCH_OAUTH_TOKEN: ""
          TWI_TWITCH_REFRESH_TOKEN: ""
          TWI_TWITCH_CLIENT_ID: ""
          TWI_TWITCH_CLIENT_SECRET: ""
          TWITCH_USERNAME: ""
          TWITCH_ACCESS_TOKEN: ""
          TWITCH_REFRESH_TOKEN: ""
          TWITCH_CLIENT_ID: ""
          TWITCH_CLIENT_SECRET: ""
        run: |
          set -eu
          scripts/snap-smoke.sh "${{ steps.build.outputs.snap }}"
          sudo snap install --dangerous --classic "${{ steps.build.outputs.snap }}"
          twi --help >/dev/null
          twi doctor >/dev/null
          twi produce -t example -m fixture --dry-run >/dev/null
          twi chat --mock --channel example >/dev/null
          sudo snap remove twi

      - name: Upload snap artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: twi-snap
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

      # Two one-time manual steps are required before these publish steps can
      # actually succeed (see docs/release.md):
      # 1. Run `snapcraft export-login --snaps=twi --acls package_access,
      #    package_push,package_update,package_release exported.txt` locally,
      #    then paste the contents of exported.txt into this repo's
      #    Settings > Secrets and variables > Actions as
      #    SNAPCRAFT_STORE_CREDENTIALS. Both publish steps below are skipped
      #    (not failed) until that secret exists.
      # 2. This snap uses classic confinement, which the Snap Store only
      #    grants after manual human review of a forum request — until that
      #    review completes, uploads with the credentials above are accepted
      #    but held back from the requested channel rather than published.
      - name: Publish to the edge channel
        if: |
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          env.HAVE_SNAPCRAFT_STORE_CREDENTIALS == 'true'
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: edge

      - name: Publish to the stable channel
        if: |
          github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
          env.HAVE_SNAPCRAFT_STORE_CREDENTIALS == 'true'
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable
