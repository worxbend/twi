name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  artifacts:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: auto
      TERM: xterm-256color
      XDG_CONFIG_HOME: /tmp/twi-config
      XDG_CACHE_HOME: /tmp/twi-cache
      TWI_TWITCH_USERNAME: ""
      TWI_TWITCH_OAUTH_TOKEN: ""
      TWI_TWITCH_REFRESH_TOKEN: ""
      TWI_TWITCH_CLIENT_ID: ""
      TWI_TWITCH_CLIENT_SECRET: ""
      TWITCH_USERNAME: ""
      TWITCH_ACCESS_TOKEN: ""
      TWITCH_REFRESH_TOKEN: ""
      TWITCH_CLIENT_ID: ""
      TWITCH_CLIENT_SECRET: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare isolated app directories
        run: mkdir -p "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"

      - name: Build and smoke release artifacts
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            export TWI_RELEASE_VERSION="$GITHUB_REF_NAME"
          fi
          scripts/release-dry-run.sh --out "$RUNNER_TEMP/twi-release" --skip-docker

      - name: Upload dry-run artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: twi-release-dry-run
          path: ${{ runner.temp }}/twi-release/
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          release_dir="$RUNNER_TEMP/twi-release"
          notes_file="$RUNNER_TEMP/twi-release-notes.md"
          python3 scripts/release-notes.py --tag "$RELEASE_TAG" --output "$notes_file"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "twi $RELEASE_TAG" \
              --notes-file "$notes_file"
          else
            gh release edit "$RELEASE_TAG" --notes-file "$notes_file"
          fi
          gh release upload "$RELEASE_TAG" \
            "$release_dir/install.sh" \
            "$release_dir/install.sh.sha256" \
            "$release_dir"/twi_linux_* \
            "$release_dir"/twi_darwin_* \
            "$release_dir/SHA256SUMS" \
            --clobber
